<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaperWrite — Handwriting Studio & PDF Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat&family=Indie+Flower&family=Kalam&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="app.js" defer></script></head>
<body>
<header><div class="logo">Paper<span>Write</span> ✍️</div>
<nav role="tablist"><button class="tab on" data-t="studio" role="tab">Handwriting Studio</button><button class="tab" data-t="editor" role="tab">PDF &amp; Image Editor</button></nav></header>

<section id="studio" class="mode"><div class="ws">
<aside class="panel">
<div class="f"><label for="hText">Your text</label><textarea id="hText" rows="9">Dear friend,

Paste or type anything here and PaperWrite turns it into neat handwritten pages. Change the font, ink, paper and spacing on the left and the preview updates live.

Long text flows onto new pages automatically.</textarea></div>
<div class="g2">
<div class="f"><label for="hFont">Font</label><select id="hFont"><option>Caveat</option><option>Kalam</option><option>Patrick Hand</option><option>Indie Flower</option></select></div>
<div class="f"><label for="hSize">Font size</label><input id="hSize" type="number" value="26" min="12" max="60"></div>
<div class="f"><label for="hInk">Ink</label><select id="hInk"><option value="#1d3fa8">Blue</option><option value="#1a1a1a">Black</option><option value="#c0262d">Red</option><option value="#1f7a3a">Green</option></select></div>
<div class="f"><label for="hAlign">Alignment</label><select id="hAlign"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></div>
<div class="f"><label for="hLs">Letter spacing</label><input id="hLs" type="number" value="0" step="0.5" min="-2" max="10"></div>
<div class="f"><label for="hWs">Word spacing</label><input id="hWs" type="number" value="4" step="1" min="-5" max="30"></div>
<div class="f"><label for="hLh">Line height (px)</label><input id="hLh" type="number" value="36" min="20" max="80"></div>
<div class="f"><label for="hPs">Paragraph gap (lines)</label><input id="hPs" type="number" value="1" min="0" max="3"></div>
<div class="f"><label for="hMargin">Margin (px)</label><input id="hMargin" type="number" value="60" min="20" max="150"></div>
<div class="f"><label for="hJit">Natural variation</label><input id="hJit" type="range" value="1" min="0" max="4" step="0.5"></div>
<div class="f"><label for="hPaper">Paper</label><select id="hPaper"><option value="ruled">Ruled</option><option value="plain">Plain white</option><option value="grid">Grid</option><option value="cream">Cream</option></select></div>
<div class="f"><label for="hPage">Page size</label><select id="hPage"><option>A4</option><option>A5</option><option>Letter</option></select></div>
<div class="f"><label for="hLand">Orientation</label><select id="hLand"><option value="0">Portrait</option><option value="1">Landscape</option></select></div>
<div class="f"><label class="chk"><input id="hMLine" type="checkbox" checked> Red margin line</label></div>
</div></aside>
<div class="stage"><div class="bar">
<button class="b2" id="hPrev" aria-label="Previous page">←</button><span id="hCount">Page 1 / 1</span><button class="b2" id="hNext" aria-label="Next page">→</button>
<button class="b2" id="hZo" aria-label="Zoom out">−</button><span id="hZ">100%</span><button class="b2" id="hZi" aria-label="Zoom in">＋</button>
<span class="sp"></span><button class="b2" id="hPng">↓ PNG (page)</button><button class="b2" id="hPngAll">↓ All PNGs</button><button class="b1" id="hPdf">↓ Export PDF</button></div>
<div class="view" id="hView"></div></div></div></section>

<section id="editor" class="mode" hidden><div class="stage full"><div class="bar">
<button class="b1" id="eUp">＋ Upload PDF / image</button><input id="eFile" type="file" accept=".pdf,image/png,image/jpeg,image/webp" hidden>
<span class="sep"></span>
<button class="b2 tl on" data-tool="select" title="Select / move">Select</button><button class="b2 tl" data-tool="pen">Pen</button><button class="b2 tl" data-tool="hl">Highlighter</button>
<button class="b2 tl" data-tool="line">Line</button><button class="b2 tl" data-tool="rect">Rect</button><button class="b2 tl" data-tool="circle">Circle</button><button class="b2 tl" data-tool="erase">Eraser</button>
<button class="b2" id="eText">＋ Text</button>
<button class="b2" id="eUndo">↶</button><button class="b2" id="eRedo">↷</button><button class="b2" id="eDel">Delete</button><button class="b2" id="eClear">Clear all</button>
<span class="sp"></span><button class="b1" id="eExport">↓ Export PDF</button></div>
<div class="bar sub">
<select id="eFont" aria-label="Font"><option>Caveat</option><option>Kalam</option><option>Patrick Hand</option><option>Indie Flower</option><option>Arial</option><option>Georgia</option><option>Courier New</option></select>
<input id="eSize" type="number" value="28" min="8" max="200" aria-label="Font size" style="width:70px"><input id="eColor" type="color" value="#1d3fa8" aria-label="Color">
<select id="eAlign" aria-label="Align"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
<label>Opacity <input id="eOp" type="range" min="0.1" max="1" step="0.1" value="1"></label>
<span class="sp"></span><button class="b2" id="ePrev">←</button><span id="ePage">Page 0 / 0</span><button class="b2" id="eNext">→</button>
<button class="b2" id="eZo">−</button><span id="eZ">100%</span><button class="b2" id="eZi">＋</button><button class="b2" id="eFit">Fit</button></div>
<div class="view empty" id="eView"><div class="empty-s"><div style="font-size:44px">📄</div><strong>Upload a PDF or image to start</strong><p>PDF, JPG, PNG or WEBP. Files never leave your browser.</p><button class="b1" id="eUp2">Choose a file</button></div><canvas id="ec" width="600" height="400"></canvas></div>
</div></section>
<div id="busy" hidden><div class="spin"></div></div><div id="toast" role="status" aria-live="polite"></div>
<footer>PaperWrite · Everything runs locally in your browser. External: cdnjs (libraries) and Google Fonts (handwriting fonts).</footer>
</body></html>
